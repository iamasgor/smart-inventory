<!-- products/partials/product_row.html -->
<tr id="product-{{ product.id }}">
  <td style="width:100px;">
    {% if product.product_image %}
    <img src="{{ product.product_image.url }}" alt="{{ product.product_name }}"
      style="max-width:80px; max-height:60px; object-fit:cover;">
    {% else %}
    <span class="text-muted">—</span>
    {% endif %}
  </td>
  <td>{{ product.product_name }}</td>
  <td>{{ product.product_code }}</td>
  <td>{{ product.product_description|truncatechars:80 }}</td>
  <td>{% if product.product_unit %}{{ product.product_unit.unit_short_name }}{% endif %}</td>
  <td>
    <button class="btn btn-sm btn-primary" hx-get="{% url 'update_product' product.id %}"
      hx-target="#product-edit-form-container" hx-swap="innerHTML" data-bs-toggle="modal"
      data-bs-target="#productEditModal">
      <i class="bi bi-pencil"></i> Edit
    </button>
  </td>
</tr>
