<!-- sales_app/templates/sales_app/dashboard.html -->
{% extends 'core/base.html' %}

{% block title %}Unit List{% endblock %}

{% block pagehead %}Unit{% endblock %}

{% block content %}
            <div class="row">
              <div class="col-12">
                <div class="card card-warning card-outline mb-4">
                  <!--begin::Header-->
                  <div class="card-header"><div class="card-title">Unit Entry Form</div></div>
                  <!--end::Header-->
                  <!--begin::Form-->
                  <form>
                    <!--begin::Body-->
                    <div class="card-body">
                      <div class="row mb-3">
                        <label for="inputEmail3" class="col-sm-2 col-form-label">Unit Name</label>
                        <div class="col-sm-10">
                          <input type="email" class="form-control" id="inputEmail3">
                        </div>
                      </div>
                      <div class="row mb-3">
                        <label for="inputPassword3" class="col-sm-2 col-form-label">Unit Short Name</label>
                        <div class="col-sm-10">
                          <input type="password" class="form-control" id="inputPassword3">
                        </div>
                      </div>
                    <!--end::Body-->
                    <!--begin::Footer-->
                    <div>
                      <a href="{% url 'unit_list' %}" class="btn btn-warning float-end">Cancel</a>
                    </div>
                    <!--end::Footer-->
                  </form>
                  <!--end::Form-->
                </div>
              </div>
            </div>
{% endblock %}
